# Netlify serves ONLY the static frontend. The game's API and WebSocket hub live in
# server.js, which needs a persistent Node process — deploy that separately (see
# render.yaml) and point public/config.js at it.
[build]
  publish = "public"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# config.js changes per environment, so never let a CDN pin an old copy.
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-store"
