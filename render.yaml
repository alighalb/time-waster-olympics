# One-click deploy: https://render.com/deploy?repo=https://github.com/alighalb/time-waster-olympics
#
# This serves the WHOLE game — Express hands out public/index.html and answers /api
# and /ws on the same origin, so no CORS and no config.js edit are needed.
services:
  - type: web
    name: time-waster-olympics
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/leaderboard
    envVars:
      - key: NODE_VERSION
        value: "22"            # better-sqlite3 ships prebuilt binaries for 22; avoids a source build
      - key: JWT_SECRET
        generateValue: true    # Render generates and stores a strong secret
      - key: ALLOWED_ORIGINS
        value: "*"

# NOTE ON DATA
# Render's free instances have no persistent disk, so data.db lives on ephemeral
# storage: the leaderboard resets whenever the service restarts or redeploys (free
# instances also sleep after ~15 min idle and cold-start on the next request).
# Fine for trying it out. To make scores durable, move to a paid instance and add:
#
#   disk:
#     name: sqlite-data
#     mountPath: /var/data
#     sizeGB: 1
#
# then set DB_PATH=/var/data/data.db in envVars.
